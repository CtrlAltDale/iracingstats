# iRacingStats, pre-rendered — the deployment to use if this is reachable by
# anyone but you.
#
# The default compose in the project root runs server.py, which is Python's
# http.server. The standard library's own documentation says that is not for
# production, and it is right. This stack serves a static build instead:
#
#   python3 build_static.py --out site
#   # copy site/ to ./html next to this file, then:
#   docker compose up -d
#
# There is no application here to attack, because there is no application.
# nginx serves files; everything else was computed once, on your machine.
#
# Re-run build_static.py after importing new races. It is a rebuild, not a sync.
#
# BEFORE YOU EXPOSE THIS: the build contains every driver on every grid you
# have raced -- names, customer ids, iRatings, clubs. Publishing it republishes
# them. `build_static.py --anonymise` replaces them with stable pseudonyms; the
# README says what that is and is not worth.

services:
  iracingstats-static:
    image: nginx:1.27-alpine
    container_name: iracingstats-static
    restart: unless-stopped
    environment:
      - TZ=UTC
    ports:
      - "8090:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      # nginx needs somewhere to write temp bodies and its pid when the root
      # filesystem is read-only.
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
