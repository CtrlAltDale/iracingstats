server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # nginx's add_header does NOT merge: a location with any add_header of its
    # own discards every one inherited from the server block. So the headers
    # are repeated in each location rather than set once here, which looks
    # redundant and is the only thing that actually works. Verified by
    # response, not by reading the config.
    #
    # The front end is entirely self-contained -- no CDN, no fonts, no
    # analytics, no outbound request of any kind -- so the policy can be as
    # tight as it gets. style-src allows inline because the charts set
    # attributes on generated SVG.
    set $sec_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'";

    gzip              on;
    gzip_types        application/json application/javascript text/css text/plain;
    gzip_min_length   1024;
    gzip_comp_level   6;

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Cache-Control "no-cache" always;
        # =404 rather than falling back to the page: a missing URL that answers
        # 200 tells a crawler, a monitor and a browser cache that it found
        # something. error_page below still serves the site shell, with the
        # status that is actually true.
        try_files $uri $uri/ =404;
    }

    # The API responses are written as extensionless files at the paths the
    # front end already fetches, so nginx has no extension to map. Say what
    # they are rather than letting them fall through to octet-stream.
    location /api/ {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve a dotfile, whatever ends up in the directory.
    location ~ /\. { deny all; }
}
